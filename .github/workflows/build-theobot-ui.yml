name: Build TheoBot UI

on:
  push:
    paths:
      - "theobot-ui/**"
      - ".github/workflows/build-theobot-ui.yml"
  pull_request:
    paths:
      - "theobot-ui/**"
      - ".github/workflows/build-theobot-ui.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theobot-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: theobot-ui-jar
          path: theobot-ui/build/libs/*.jar
